<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
</head>
<body>
    <div id="header">AXOS BANK</div>
    <div id="content">
        <div id="leftPanel">
            <div class="leftCell">
                <h1>Home</h1>
                <ul id="home">
                    <li>Inbox</li>
                    <li>Today</li>
                    <li>Week</li>
                    <li>Important</li>
                    <li>Completed</li>
                </ul>
            </div>
            <div class="leftCell">
                <h1 class="panelTitle">
                    Projects
                    <button class="btn">
                        <img class = "favicon plusHover add" src="./imgs/plus.svg" alt="add to projects">
                    </button>
                </h1>
                <ul id="Projects">
                </ul>

            </div>
        </div>

        <div id="rightPanel">
            <h1>Subject</h1>
            <ul id="todoList">
            </ul>
            
            <div class="button-subj " >
                <button id="openBtn" class="btn add-proj-button ">
                    <img  src="./imgs/plus.svg" class="add-proj add"></img>
                    <div class="flx">
                    add to project

                    </div>
                </button>
            </div>
        </div>
    </div>
    <div id="footer">
        footer
    </div>

    <div id="popup" class="popup" style="display:none;">
        <div class="popup-content">
            <h2>Add Task</h2>
            <form>
            <label for="title">Task:</label><br />
            <input type="text" id="title" name="title" /><br />

            <label for="detail">Details:</label><br />
            <input type="text" id="detail" name="detail" /><br />

            <label for="date">Date:</label><br />
            <input type="date" id="date" name="date" /><br />

            <label for="priority">Priority?</label><br />
            <input type="checkbox" id="priority" name="priority" /><br />

            <div class="buttons">
                <button id="submitBtn" type="submit">Add</button>
                <button id="closeBtn" class="close" type="button">Cancel</button>
            </div>
            </form>
        </div>
    </div>
    
</body>
</html>
